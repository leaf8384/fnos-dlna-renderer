name: build-fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 构建机 glibc 必须不高于目标机。Ubuntu 22.04 是 2.35，
    # Debian 12 (fnOS 底座) 是 2.36，所以这里编出来的包能在 fnOS 上跑。
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          set -x
          # runner 的 apt 源偶尔会短暂异常，update 失败不该直接判死整个 job，
          # 真正的依赖缺失留给 build.sh 去报，那里提示更准确。
          sudo apt-get update -o Acquire::Retries=3 -y || echo "apt-get update 有非致命错误，继续"
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libgstreamer1.0-dev
          # libupnp 的 dev 包名在不同发行版间会变，按可用性择优
          sudo apt-get install -y --no-install-recommends libupnp-dev || \
            sudo apt-get install -y --no-install-recommends libupnp13-dev

      - name: 依赖诊断
        if: failure()
        run: |
          echo "--- apt 源 ---"
          grep -rhE '^deb ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -20
          echo "--- libupnp 相关可用包 ---"
          apt-cache search libupnp || true
          echo "--- gstreamer dev ---"
          apt-cache policy libgstreamer1.0-dev || true

      - name: 校验 fnpack.json
        run: python3 -c "import json,sys; json.load(open('fnpack.json')); print('fnpack.json 合法')"

      - name: 构建
        run: bash scripts/build.sh

      - name: 打包 fpk
        run: bash scripts/package-fpk.sh

      - name: 回填 fnpack.json
        run: |
          python3 scripts/update-fnpack.py \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(ls dist | head -1)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ github.sha }}
          path: dist/*.fpk

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            fnpack.json
          generate_release_notes: true
