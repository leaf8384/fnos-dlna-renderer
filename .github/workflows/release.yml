name: build-fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 不用宿主机的 apt 直接装依赖：runner 镜像预装了一堆包，
      # libgstreamer1.0-dev 会撞上 libunwind-dev 的版本约束（held broken packages）。
      # 更关键的是，我们要的产物是跑在 fnOS 上的 —— 而 fnOS 底座就是 Debian 12。
      # 直接在 debian:12 容器里编译，glibc 2.36 精确对齐，不会出现
      # "GLIBC_2.xx not found"，也不受 runner 镜像污染。
      - name: 在 Debian 12 容器内构建并打包
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            debian:12 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential autoconf automake libtool pkg-config \
                libupnp-dev libgstreamer1.0-dev
              bash scripts/build.sh
              bash scripts/package-fpk.sh
            '
          # 容器里以 root 写出来的文件，把属主交还给 runner
          sudo chown -R "$(id -u):$(id -g)" build dist

      - name: 校验 fnpack.json
        run: python3 -c "import json; json.load(open('fnpack.json')); print('fnpack.json 合法')"

      - name: 回填 fnpack.json
        run: |
          # 不要用 ls | head -1：dist/ 里可能同时留着历史版本的 fpk，
          # 按字母序会选到旧的那个，导致 download_url 指向已废弃的包。
          # 刚构建出来的包 mtime 最新，用 ls -t 才可靠。
          FPK="$(ls -t dist/*.fpk | head -1)"
          echo "回填：$FPK"
          python3 scripts/update-fnpack.py \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$FPK")"

      - name: 删除历史版本的 fpk（只发布本次构建的）
        run: |
          CURRENT="$(ls -t dist/*.fpk | head -1)"
          find dist -name '*.fpk' ! -path "$CURRENT" -print -delete
          ls -l dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ github.sha }}
          path: dist/*.fpk

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            fnpack.json
          generate_release_notes: true
