<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>DLNA 音频桥</title>
<style>
  :root {
    --brand: #4778ff;
    --brand-dark: #3d5dff;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1b1f2a;
    --text-2: #5b6478;
    --text-3: #8b93a5;
    --line: #e6eaf2;
    --ok: #16a34a;
    --ok-bg: #e9f9ef;
    --err: #dc2626;
    --err-bg: #fdeceb;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;                 /* 飞牛是内嵌窗口，出现外层滚动条很难看 */
    padding: 16px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* ---- 头部 ---- */
  header { display: flex; align-items: center; gap: 11px; flex: none; }
  .logo {
    width: 38px; height: 38px; flex: none;
    border-radius: 11px;
    background: linear-gradient(160deg, var(--brand), var(--brand-dark));
    display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(71,120,255,.26);
  }
  .logo svg { width: 21px; height: 21px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  .sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  header .spacer { flex: 1; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.on  { color: var(--ok);  background: var(--ok-bg); }
  .badge.off { color: var(--err); background: var(--err-bg); }
  .badge.on .dot { box-shadow: 0 0 0 3px rgba(22,163,74,.15); }

  /* ---- 主体两栏 ---- */
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0,1.08fr) minmax(0,1fr);
    gap: 12px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(20,30,60,.04), 0 6px 20px rgba(20,30,60,.05);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .card h2 {
    font-size: 11.5px; font-weight: 600; letter-spacing: .5px;
    color: var(--text-3); text-transform: uppercase;
    margin: 0 0 12px; flex: none;
  }

  /* ---- 正在播放 ---- */
  /* 窗口被拉高时，把播放区整体垂直居中，避免全挤在顶部留一大片白 */
  .player-body { margin: auto 0; }
  .now-title {
    font-size: 16.5px; font-weight: 600; line-height: 1.35;
    margin: 0 0 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .now-title.idle { color: var(--text-3); font-weight: 500; }
  .now-sub {
    font-size: 12.5px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .bar-wrap { margin: 16px 0 6px; flex: none; }
  .bar {
    height: 6px; border-radius: 99px; background: var(--line);
    position: relative; cursor: pointer;
  }
  .bar .fill {
    position: absolute; inset: 0 auto 0 0; width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--brand), var(--brand-dark));
    transition: width .35s linear;
  }
  .bar .knob {
    position: absolute; top: 50%; left: 0;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: #fff;
    border: 3px solid var(--brand);
    box-shadow: 0 1px 4px rgba(30,50,110,.25);
    transition: left .35s linear;
  }
  .bar.disabled { cursor: default; opacity: .55; }
  .times {
    display: flex; justify-content: space-between;
    font-size: 11.5px; color: var(--text-3); margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; flex: none;
  }
  .btn-icon {
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer;
    display: grid; place-items: center;
    background: var(--bg); color: var(--text-2);
    transition: background .15s, color .15s, transform .1s;
  }
  .btn-icon:hover { background: #e8ecf5; color: var(--text); }
  .btn-icon:active { transform: scale(.94); }
  .btn-icon.primary {
    width: 50px; height: 50px;
    background: linear-gradient(160deg, var(--brand), var(--brand-dark));
    color: #fff;
    box-shadow: 0 5px 14px rgba(71,120,255,.32);
  }
  .btn-icon.primary:hover { background: linear-gradient(160deg, #5484ff, #4363ff); color: #fff; }
  .btn-icon:disabled { opacity: .4; cursor: default; }
  .btn-icon svg { width: 18px; height: 18px; }
  .btn-icon.primary svg { width: 21px; height: 21px; }

  .vol { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--text-3); }
  .vol svg { width: 16px; height: 16px; flex: none; }
  .vol input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 92px; height: 4px; border-radius: 99px;
    background: var(--line); outline: none; cursor: pointer;
  }
  .vol input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand);
    box-shadow: 0 1px 4px rgba(30,50,110,.22);
  }
  .vol input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand);
  }
  .vol .pct { font-size: 11.5px; width: 26px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---- 设置 ---- */
  .settings-body { margin: auto 0; }
  .field { margin-bottom: 11px; flex: none; }
  .field label {
    display: block; font-size: 12px; color: var(--text-3);
    margin-bottom: 4px;
  }
  .field input[type=text], .field select {
    width: 100%; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 9px;
    background: #fbfcfe; color: var(--text);
    font-size: 13.5px; font-family: inherit;
    outline: none; transition: border-color .15s, background .15s;
  }
  .field input[type=text]:focus, .field select:focus {
    border-color: var(--brand); background: #fff;
    box-shadow: 0 0 0 3px rgba(71,120,255,.12);
  }
  .actions { display: flex; gap: 8px; margin-top: 4px; padding-top: 2px; flex: none; }
  button.btn {
    flex: 1; padding: 9px 14px; border-radius: 9px;
    border: 1px solid var(--line); background: #fff;
    color: var(--text); font-size: 13.5px; font-family: inherit;
    cursor: pointer; transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  button.btn:hover { background: #f6f8fd; border-color: #d8e0ee; }
  button.btn:disabled { opacity: .55; cursor: default; }
  button.btn.primary {
    border-color: transparent; color: #fff;
    background: linear-gradient(160deg, var(--brand), var(--brand-dark));
    box-shadow: 0 3px 10px rgba(71,120,255,.26);
  }
  button.btn.primary:hover { background: linear-gradient(160deg, #5484ff, #4363ff); }

  /* ---- 底部 ---- */
  footer {
    flex: none;
    font-size: 11.5px; color: var(--text-3);
    display: flex; align-items: center; gap: 10px;
    min-height: 18px;
  }
  footer .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer .msg { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; }
  footer .msg.ok { color: var(--ok); }
  footer .msg.err { color: var(--err); }

  /* 窄窗口：退回单栏，允许滚动（手机上本来也要滚） */
  @media (max-width: 720px) {
    body { overflow: auto; height: auto; }
    main { grid-template-columns: 1fr; }
  }
  /* 矮窗口：压缩留白，尽量不出滚动条 */
  @media (max-height: 560px) {
    body { padding: 10px 14px 8px; gap: 9px; }
    .card { padding: 12px 14px; }
    .card h2 { margin-bottom: 9px; }
    .bar-wrap { margin: 10px 0 4px; }
    .controls { margin-top: 10px; }
    .field { margin-bottom: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6 9H3v6h3l5 4V5z"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
  </div>
  <div>
    <h1>DLNA 音频桥</h1>
    <div class="sub" id="devsub">DLNA / UPnP 音频渲染器</div>
  </div>
  <div class="spacer"></div>
  <span class="badge off" id="badge"><span class="dot"></span><span id="badgetext">读取中</span></span>
</header>

<main>
  <!-- 左：正在播放 -->
  <section class="card">
    <h2>正在播放</h2>
    <div class="player-body">
    <div class="now-title idle" id="title">未在播放</div>
    <div class="now-sub" id="artist">用手机音乐 App 投屏到这台设备</div>

    <div class="bar-wrap">
      <div class="bar disabled" id="bar">
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="times"><span id="tpos">0:00</span><span id="tdur">0:00</span></div>
    </div>

    <div class="controls">
      <button class="btn-icon primary" id="btnToggle" title="播放 / 暂停" disabled>
        <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="btn-icon" id="btnStop" title="停止" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <div class="vol">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>
        </svg>
        <input type="range" id="vol" min="0" max="100" value="60" disabled>
        <span class="pct" id="volpct">--</span>
      </div>
    </div>
    </div>
  </section>

  <!-- 右：设备设置 -->
  <section class="card">
    <h2>设备设置</h2>
    <div class="settings-body">
    <div class="field">
      <label for="name">广播名（手机上显示的名字）</label>
      <input type="text" id="name" maxlength="32" placeholder="例如：客厅音箱">
    </div>
    <div class="field">
      <label for="audio">输出声卡</label>
      <select id="audio"></select>
    </div>
    <div class="field">
      <label for="iface">广播网卡</label>
      <select id="iface"></select>
    </div>
    <div class="actions">
      <button class="btn" id="btnTone">测试音</button>
      <button class="btn primary" id="btnSave">保存并重启</button>
    </div>
    </div>
  </section>
</main>

<footer>
  <span class="meta" id="footmeta">读取中…</span>
  <span class="msg" id="msg"></span>
</footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = null;          // /api/state
  var devices = null;        // /api/devices
  var nowTimer = null;
  var lastVolSet = 0;

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function setMsg(text, kind) {
    var el = $('msg');
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function fillSelect(sel, items, current) {
    sel.innerHTML = '';
    var found = false;
    items.forEach(function (it) {
      var o = document.createElement('option');
      o.value = it.value;
      o.textContent = it.text;
      if (it.value === current) { o.selected = true; found = true; }
      sel.appendChild(o);
    });
    if (!found && current) {
      var o = document.createElement('option');
      o.value = current;
      o.textContent = current + '（当前，已不可用）';
      o.selected = true;
      sel.insertBefore(o, sel.firstChild);
    }
  }

  function loadState() {
    return fetch('/api/state').then(function (r) { return r.json(); }).then(function (s) {
      state = s;
      var on = !!s.running;
      $('badge').className = 'badge ' + (on ? 'on' : 'off');
      $('badgetext').textContent = on ? '运行中' : '已停止';
      $('devsub').textContent = s.friendly_name || 'DLNA 音频渲染器';
      $('name').value = s.friendly_name || '';
      $('footmeta').textContent = 'v' + s.version + ' · ' + s.listen_addr +
        ' · ' + (s.audiodev || '');
      if (!on) {
        setNowIdle('渲染器已停止');
      }
    });
  }

  function loadDevices() {
    return fetch('/api/devices').then(function (r) { return r.json(); }).then(function (d) {
      devices = d;
      fillSelect($('iface'),
        (d.ifaces || []).map(function (i) {
          return { value: i.name, text: i.name + ' · ' + i.ipv4 + (i.default ? '（默认路由）' : '') };
        }), state && state.iface);

      fillSelect($('audio'),
        (d.cards || []).map(function (c) {
          return {
            value: c.value,
            text: c.name + ' — ' + c.chip + (c.busy ? '（占用中）' : '')
          };
        }), state && state.audiodev);
    });
  }

  // ---------------- 播放状态 ----------------

  function setNowIdle(text) {
    $('title').textContent = text || '未在播放';
    $('title').className = 'now-title idle';
    $('artist').textContent = '用手机音乐 App 投屏到这台设备';
    $('fill').style.width = '0%';
    $('knob').style.left = '0%';
    $('tpos').textContent = '0:00';
    $('tdur').textContent = '0:00';
    $('btnToggle').disabled = true;
    $('btnStop').disabled = true;
    $('bar').className = 'bar disabled';
  }

  function renderNow(n) {
    var playing = n.state === 'PLAYING';
    var paused = n.state === 'PAUSED_PLAYBACK' || n.state === 'PAUSED';

    if (!n.running) {
      setNowIdle('渲染器已停止');
      return;
    }
    // 渲染器会停在「PLAYING 但没有曲目」的僵尸态（EOS 后客户端又补了一个 Play），
    // 这时不能继续显示上一首，否则进度归零但曲名还在，很误导。
    if (!n.has_media) {
      setNowIdle('未在播放');
      $('btnToggle').disabled = false;
      return;
    }
    var active = playing || paused;
    if (!active) {
      setNowIdle('已停止');
      $('btnToggle').disabled = false;
      return;
    }

    if (n.title) {
      $('title').textContent = n.title;
      $('title').className = 'now-title';
    }
    var who = [];
    if (n.artist) who.push(n.artist);
    if (n.album && n.album !== n.title) who.push(n.album);
    $('artist').textContent = who.join(' · ') || '未知艺人';

    var dur = n.duration || 0, pos = n.position || 0;
    var pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;
    $('fill').style.width = pct + '%';
    $('knob').style.left = pct + '%';
    $('tpos').textContent = fmt(pos);
    $('tdur').textContent = fmt(dur);
    $('bar').className = 'bar' + (dur > 0 ? '' : ' disabled');

    $('btnToggle').disabled = false;
    $('btnStop').disabled = !active;
    $('icoPlay').style.display = playing ? 'none' : '';
    $('icoPause').style.display = playing ? '' : 'none';

    if (typeof n.volume === 'number') {
      $('vol').disabled = false;
      if (Date.now() - lastVolSet > 1200) {
        $('vol').value = n.volume;
        $('volpct').textContent = n.volume + '%';
      }
    }
  }

  function pollNow() {
    if (document.hidden) return;
    fetch('/api/now').then(function (r) { return r.json(); }).then(renderNow).catch(function () {});
  }

  function startPoll() {
    if (nowTimer) clearInterval(nowTimer);
    nowTimer = setInterval(pollNow, 1000);
    pollNow();
  }

  // ---------------- 控制 ----------------

  function control(payload) {
    return fetch('/api/control', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.body.ok) {
          setMsg((res.body && res.body.message) || '操作失败', 'err');
        } else {
          setMsg('');
        }
        setTimeout(pollNow, 250);
        return res;
      });
  }

  $('btnToggle').onclick = function () {
    var playing = $('icoPause').style.display !== 'none';
    control({ action: playing ? 'pause' : 'play' });
  };
  $('btnStop').onclick = function () { control({ action: 'stop' }); };

  $('vol').oninput = function () {
    $('volpct').textContent = this.value + '%';
  };
  $('vol').onchange = function () {
    lastVolSet = Date.now();
    control({ action: 'volume', value: parseInt(this.value, 10) });
  };

  $('bar').onclick = function (ev) {
    if (this.className.indexOf('disabled') >= 0) return;
    var rect = this.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    control({ action: 'seek', value: Math.round(ratio * (parseFloat($('tdur').textContent.split(':')[0]) * 60 +
      parseFloat($('tdur').textContent.split(':')[1] || 0))) });
  };

  // ---------------- 保存 / 测试音 ----------------

  $('btnTone').onclick = function () {
    this.disabled = true;
    setMsg('正在播放测试音…');
    fetch('/api/test-tone', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audiodev: $('audio').value })
    }).then(function (r) { return r.json(); }).then(function (j) {
      setMsg(j.message || (j.ok ? '已播放' : '失败'), j.ok ? 'ok' : 'err');
    }).catch(function (e) {
      setMsg('请求失败：' + e.message, 'err');
    }).then(function () { $('btnTone').disabled = false; });
  };

  $('btnSave').onclick = function () {
    var payload = {
      friendly_name: $('name').value,
      iface: $('iface').value,
      audiodev: $('audio').value
    };
    var ifaceChanged = state && payload.iface !== state.iface;
    this.disabled = true;
    setMsg('保存中…');
    fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (j) {
      var extra = '';
      if (j.ok && ifaceChanged) extra = '（换了网卡，手机上可能 1–2 分钟才重新出现）';
      setMsg((j.message || (j.ok ? '已保存' : '失败')) + extra, j.ok ? 'ok' : 'err');
      return loadState().then(loadDevices).then(startPoll);
    }).catch(function (e) {
      setMsg('请求失败：' + e.message, 'err');
    }).then(function () { $('btnSave').disabled = false; });
  };

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) pollNow();
  });

  loadState().then(loadDevices).then(startPoll).catch(function (e) {
    setMsg('无法连接控制台：' + e.message, 'err');
  });
})();
</script>
</body>
</html>
